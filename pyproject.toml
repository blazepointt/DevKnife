[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "devknife"
version = "0.1.0"
description = "A modular Swiss-army-knife CLI for developers."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.scripts]
devknife = "devknife.cli:app"

[project.optional-dependencies]
format = [
    "ruamel.yaml>=0.18,<0.19",
    "tomli-w>=1.0,<2.0",
]
crypto = [
    "PyJWT>=2.8,<3.0",
    "cryptography>=42.0,<47.0",
]
net = [
    "httpx>=0.27,<1.0",
    "anyio>=4.0,<5.0",
]
gen = [
    "uuid6>=2024.1.12,<2027.0",
    "Faker>=24.0,<40.0",
]
tokens = [
    "tiktoken>=0.7,<1.0",
]
all = [
    "ruamel.yaml>=0.18,<0.19",
    "tomli-w>=1.0,<2.0",
    "PyJWT>=2.8,<3.0",
    "cryptography>=42.0,<47.0",
    "httpx>=0.27,<1.0",
    "anyio>=4.0,<5.0",
    "uuid6>=2024.1.12,<2027.0",
    "Faker>=24.0,<40.0",
    "tiktoken>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devknife"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
]
